name: ci

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dimentorr/dnd_toolkit

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Ruff check
        run: poetry run ruff check backend core tests

      - name: Ruff format check
        run: poetry run ruff format --check backend core tests

  tests:
    name: tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dnd_toolkit_test
          POSTGRES_USER: dnd_test
          POSTGRES_PASSWORD: dnd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dnd_test -d dnd_toolkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_SECRET_KEY: test-secret-key
      APP_ALGORITHM: HS256
      DND_TEST_DATABASE_URL: postgresql+psycopg://dnd_test:dnd_test@localhost:5432/dnd_toolkit_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Configure Poetry
        run: poetry config virtualenvs.in-project true

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            .venv
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        run: poetry run pytest -q

  version-check:
    name: Check project version
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      version: ${{ steps.compare.outputs.version }}
      previous_version: ${{ steps.compare.outputs.previous_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare project versions
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path


          def read_version(content: bytes) -> str:
              config = tomllib.loads(content.decode("utf-8"))

              if "project" in config and "version" in config["project"]:
                  return config["project"]["version"]

              if (
                  "tool" in config
                  and "poetry" in config["tool"]
                  and "version" in config["tool"]["poetry"]
              ):
                  return config["tool"]["poetry"]["version"]

              raise RuntimeError(
                  "Version not found in pyproject.toml. "
                  "Expected project.version or tool.poetry.version."
              )


          current_version = read_version(Path("pyproject.toml").read_bytes())

          if os.environ["EVENT_NAME"] == "pull_request":
              base_sha = os.environ.get("PR_BASE_SHA", "")
          else:
              base_sha = os.environ.get("BEFORE_SHA", "")

          zero_sha = "0" * 40
          previous_version = None

          if base_sha and base_sha != zero_sha:
              try:
                  previous_content = subprocess.check_output(
                      ["git", "show", f"{base_sha}:pyproject.toml"],
                      stderr=subprocess.DEVNULL,
                  )
              except subprocess.CalledProcessError:
                  previous_version = None
              else:
                  previous_version = read_version(previous_content)

          changed = previous_version != current_version

          print(f"Previous version: {previous_version or '<not found>'}")
          print(f"Current version:  {current_version}")
          print(f"Version changed:  {changed}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
              output.write(f"version={current_version}\n")
              output.write(f"previous_version={previous_version or ''}\n")
          PY

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - ruff
      - tests
      - version-check
    if: needs.version-check.outputs.changed == 'true'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version-check.outputs.version }}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max